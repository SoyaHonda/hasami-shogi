[platformio]
default_envs = native

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -ffp-contract=off

[env:native]
platform = native
test_framework = unity
lib_ignore = hw
; src/ is firmware only (Arduino); native runs tests, never builds src/.
build_src_filter = -<*>

; One-square prototype measurement firmware (src/rig/ only).
; espressif32 7.1.3 bundles Arduino-ESP32 2.0.17 (framework-arduinoespressif32
; ~4.20017.0); 8.x moves to Arduino 3.x, which FastAccelStepper does not support.
[env:rig]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
build_src_filter = -<*> +<rig/>
lib_deps =
    gin66/FastAccelStepper@2.0.1
    fastled/FastLED@3.10.8
monitor_speed = 115200
