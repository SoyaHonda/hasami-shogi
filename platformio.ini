[platformio]
default_envs = native

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -ffp-contract=off

[env:native]
platform = native
test_framework = unity
lib_ignore = hw
; src/ is firmware only (Arduino); native runs tests, never builds src/.
build_src_filter = -<*>

; Bring-up / production firmware (src/ except src/rig/). Same platform and
; libraries as rig. src/golden_cases.h is generated, not in git:
; run `node tools/gen-golden.mjs` before building.
[env:esp32dev]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
build_src_filter = +<*> -<rig/>
lib_deps =
    gin66/FastAccelStepper@2.0.1
    fastled/FastLED@3.10.8
monitor_speed = 115200

; One-square prototype measurement firmware (src/rig/ only).
; espressif32 7.1.3 bundles Arduino-ESP32 2.0.17 (framework-arduinoespressif32
; ~4.20017.0); 8.0.0 moves to Arduino 3.3.x (~4.30312.0). FastAccelStepper fails
; to compile on Arduino 3.0.x and supports 3.1+ (IDF 5.3+); 7.1.3 is kept as planned.
[env:rig]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
build_src_filter = -<*> +<rig/>
lib_deps =
    gin66/FastAccelStepper@2.0.1
    fastled/FastLED@3.10.8
monitor_speed = 115200
