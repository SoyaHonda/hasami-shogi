name: CI

on: [push, pull_request]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Unit tests (native)
        run: pio test -e native

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Read emsdk version
        id: emsdk
        run: echo "version=$(cat .emsdk-version)" >> "$GITHUB_OUTPUT"
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ steps.emsdk.outputs.version }}
          actions-cache-folder: emsdk-cache
      - run: npm ci
      - name: Build WASM
        run: npm run build:wasm
      - name: Node.js tests
        run: npm test
      - name: Automatic games
        run: node tools/autoplay.mjs --games 20
      # web/hasami.js is not in git, so the Pages artifact is made here, right after the build.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
