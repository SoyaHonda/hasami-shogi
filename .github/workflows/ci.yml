name: CI

on: [push, pull_request]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Unit tests (native)
        run: pio test -e native
