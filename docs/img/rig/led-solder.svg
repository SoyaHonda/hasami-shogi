<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 990" width="1180" height="990" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f7b74"/></marker></defs>
<rect width="1180" height="990" fill="#ffffff"/>
<text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b231f">LED（AE-WS2812B）のどこをはんだ付けするか</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5a6760">穴はない。縁の半円の切り欠き（金色）に、線の芯線を当ててはんだ付けする。大きさは実物の約 10 倍</text>
