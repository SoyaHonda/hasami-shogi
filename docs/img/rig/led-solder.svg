<path d="M351.7 498.0 A28.5 28.5 0 0 1 408.7 498.0 Z" fill="#e3c26b" stroke="#a8862b"/>
<path d="M365.2 498.0 A15.0 15.0 0 0 1 395.2 498.0 Z" fill="#ffffff" stroke="#a8862b"/>
<text x="380.2" y="549.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#a7aeb4">GND</text>
<rect x="238.0" y="318.0" width="132.0" height="132.0" rx="3" fill="#fbfbf5" stroke="#c9ced2" />
<circle cx="304.0" cy="384.0" r="48.0" fill="#f1e9ec" stroke="#d9cdd3"/>
<text x="304.0" y="389.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#9aa1a6">LED</text>
<rect x="166.0" y="360.0" width="24.0" height="48.0" rx="2" fill="#b9bec2" stroke="none" />
<rect x="418.0" y="360.0" width="24.0" height="48.0" rx="2" fill="#b9bec2" stroke="none" />
<rect x="188.8" y="195.0" width="230.4" height="111.0" rx="10" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="40.0" y="144.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#c0392b">DI と書いてある辺の 3 つだけを使う</text>
<text x="40.0" y="164.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">名前の下は付ける線の色</text>
<text x="227.8" y="248.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#c0392b">赤</text>
<text x="304.0" y="248.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#27ae60">緑</text>
<text x="380.2" y="248.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1b231f">黒</text>
<text x="304.0" y="586.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#5a6760">DO の辺は使わない（何も付けない）</text>
<text x="40.0" y="616.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1b231f">この面はあとでアクリルに押し付ける。はんだも線も出さない</text>
<rect x="600.0" y="80.0" width="556.0" height="560.0" rx="8" fill="#f6f7f5" stroke="#d5dad6" />
<text x="616.0" y="110.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1b231f">② 裏返して机に置いた図（はんだ付けする向き）</text>
<text x="616.0" y="144.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#c0392b">左右が逆になる。左から GND・DI・VDD</text>
<text x="616.0" y="164.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">線を外から当て、芯線の先 3mm を金色の半円に載せる</text>
<rect x="710.0" y="330.0" width="306.0" height="228.0" rx="4" fill="#f6eff3" stroke="#c9b8c2" />
