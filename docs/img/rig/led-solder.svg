<path d="M924.2 558.0 A15.0 15.0 0 0 1 954.2 558.0 Z" fill="#ffffff" stroke="#a8862b"/>
<text x="863.0" y="449.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#a7aeb4">裏（LED は下）</text>
<path d="M786.8 192.0 V240.0" stroke="#1b231f" stroke-width="10" stroke-linecap="round"/>
<path d="M786.8 240.0 V339.0" stroke="#b8bec4" stroke-width="5" stroke-linecap="round"/>
<circle cx="786.8" cy="324.0" r="8" fill="#f1c40f" stroke="#7d6608" stroke-width="1.5" opacity="0.9"/>
<text x="786.8" y="180.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#1b231f">GND</text>
<path d="M863.0 192.0 V240.0" stroke="#27ae60" stroke-width="10" stroke-linecap="round"/>
<path d="M863.0 240.0 V339.0" stroke="#b8bec4" stroke-width="5" stroke-linecap="round"/>
<circle cx="863.0" cy="324.0" r="8" fill="#f1c40f" stroke="#7d6608" stroke-width="1.5" opacity="0.9"/>
<text x="863.0" y="180.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#27ae60">DI</text>
