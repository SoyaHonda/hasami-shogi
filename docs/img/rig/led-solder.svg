<circle cx="939.2" cy="324.0" r="8" fill="#f1c40f" stroke="#7d6608" stroke-width="1.5" opacity="0.9"/>
<text x="939.2" y="180.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#c0392b">VDD</text>
<path d="M943.2 276.0 L1050.0 230.0" stroke="#7a857e" fill="none"/><circle cx="943.2" cy="276.0" r="2.5" fill="#7a857e"/>
<text x="1050.0" y="206.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#1b231f">芯線 3mm</text>
<text x="1050.0" y="222.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5a6760">（予備はんだで銀色）</text>
<path d="M948.2 324.0 L1050.0 350.0" stroke="#7a857e" fill="none"/><circle cx="948.2" cy="324.0" r="2.5" fill="#7a857e"/>
<text x="1050.0" y="370.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#7d6608">ここをはんだ付け</text>
<text x="1050.0" y="388.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5a6760">（黄色の点）</text>
<text x="616.0" y="580.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1b231f">1 本付けるたびに、隣の半円とはんだで</text>
<text x="616.0" y="598.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1b231f">つながっていないか見る。特に真ん中の DI</text>
<text x="616.0" y="618.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">テープで基板と線を机に留めてから付ける</text>
<rect x="24.0" y="660.0" width="1132.0" height="310.0" rx="8" fill="#f6f7f5" stroke="#d5dad6" />
<text x="40.0" y="690.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1b231f">③ 横から見た図（② を手前から見たところ。LED の面が下）</text>
<path d="M60 910 H1120" stroke="#8a958e" stroke-width="2"/>
<text x="70.0" y="930.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">机</text>
<rect x="438.0" y="862.0" width="150.0" height="48.0" rx="3" fill="#fbfbf5" stroke="#c9ced2" />
<text x="513.0" y="891.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5a6760">LED（面を下）</text>
<rect x="360.0" y="832.0" width="306.0" height="30.0" rx="2" fill="#f6eff3" stroke="#c9b8c2" />
<text x="450.0" y="822.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1b231f">基板の裏（上を向いている）</text>
<rect x="636.0" y="829.0" width="30.0" height="3.0" rx="0" fill="#e3c26b" stroke="#a8862b" />
<rect x="663.0" y="832.0" width="3.0" height="30.0" rx="0" fill="#e3c26b" stroke="#a8862b" />
<rect x="636.0" y="862.0" width="30.0" height="3.0" rx="0" fill="#e3c26b" stroke="#a8862b" />
<path d="M831.0 828.0 H732.0" stroke="#27ae60" stroke-width="12" stroke-linecap="round"/>
<path d="M732.0 828.0 H642.0" stroke="#b8bec4" stroke-width="6" stroke-linecap="round"/>
<path d="M636.0 830.0 Q672.0 812.0 696.0 830.0 L669.0 862.0 L666.0 862.0 Z" fill="#c9ccce" stroke="#8d9296" opacity="0.9"/>
<path d="M678.0 822.0 L774.0 742.0" stroke="#7a857e" fill="none"/><circle cx="678.0" cy="822.0" r="2.5" fill="#7a857e"/>
<text x="774.0" y="720.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#7d6608">はんだは裏の金色の縁と</text>
<text x="774.0" y="737.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#7d6608">半円の中に流れる</text>
<path d="M801.0 828.0 L882.0 872.0" stroke="#7a857e" fill="none"/><circle cx="801.0" cy="828.0" r="2.5" fill="#7a857e"/>
<text x="882.0" y="890.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1b231f">線は裏の面の高さで、外から当てる</text>
<path d="M651.0 865.0 L591.0 940.0" stroke="#7a857e" fill="none"/><circle cx="651.0" cy="865.0" r="2.5" fill="#7a857e"/>
<text x="591.0" y="956.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#c0392b">LED の面の側に、はんだを回り込ませない</text>
