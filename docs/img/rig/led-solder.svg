<path d="M365.2 270.0 A15.0 15.0 0 0 0 395.2 270.0 Z" fill="#ffffff" stroke="#a8862b"/>
<text x="380.2" y="231.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#2b2f33">GND</text>
