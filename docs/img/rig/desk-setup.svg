<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" width="980" height="390" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f7b74"/></marker></defs><rect width="980" height="390" fill="#ffffff"/><text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b231f">机の上での仮の置き方（横から見た図。大きさは正確ではない）</text><text x="24.0" y="72.0" font-size="14" text-anchor="start" font-weight="bold" fill="#1b231f">A5・A6: アクリル板を本 2 冊に渡し、裏にセンサーを留める</text><path d="M24 330 H520" stroke="#8a958e" stroke-width="2"/><text x="60.0" y="348.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">机</text><rect x="60.0" y="240.0" width="110.0" height="90.0" fill="#d9cbb3" stroke="#4a524d" /><rect x="370.0" y="240.0" width="110.0" height="90.0" fill="#d9cbb3" stroke="#4a524d" /><text x="115.0" y="290.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b231f">本</text><text x="425.0" y="290.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b231f">本</text><rect x="40.0" y="228.0" width="460.0" height="12.0" fill="#e8eef3" stroke="#8fa6b6" /><rect x="254.0" y="240.0" width="32.0" height="10.0" fill="#262a2d" stroke="#4a524d" /><rect x="244.0" y="250.0" width="52.0" height="4.0" fill="#f2d16b" stroke="#b89a3c" /><circle cx="270" cy="226" r="3.5" fill="#1b231f"/><rect x="255.0" y="219.0" width="30.0" height="6.0" fill="#a7aeb4" stroke="#6f777d" /><rect x="255.0" y="213.0" width="30.0" height="6.0" fill="#a7aeb4" stroke="#6f777d" /><rect x="255.0" y="207.0" width="30.0" height="6.0" fill="#a7aeb4" stroke="#6f777d" /><rect x="255.0" y="201.0" width="30.0" height="6.0" fill="#a7aeb4" stroke="#6f777d" /><rect x="255.0" y="195.0" width="30.0" height="6.0" fill="#a7aeb4" stroke="#6f777d" /><rect x="255.0" y="189.0" width="30.0" height="6.0" fill="#a7aeb4" stroke="#6f777d" /><text x="270.0" y="180.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1b231f">磁石（S 極の向きを調べる）</text><path d="M262.0 226.0 L120.0 180.0" stroke="#7a857e" fill="none"/><circle cx="262.0" cy="226.0" r="2.5" fill="#7a857e"/><text x="116.0" y="174.0" font-size="12.5" text-anchor="end" font-weight="normal" fill="#1b231f">油性ペンの点</text><path d="M300.0 234.0 L380.0 200.0" stroke="#7a857e" fill="none"/><circle cx="300.0" cy="234.0" r="2.5" fill="#7a857e"/><text x="386.0" y="196.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1b231f">アクリル板（切る前のまま）</text><path d="M270.0 254.0 L270.0 344.0" stroke="#7a857e" fill="none"/><circle cx="270.0" cy="254.0" r="2.5" fill="#7a857e"/><text x="278.0" y="356.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1b231f">センサー。マーク面を上（アクリル側）にして、</text><text x="278.0" y="373.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1b231f">マスキングテープ（黄）で裏に留める</text><text x="560.0" y="72.0" font-size="14" text-anchor="start" font-weight="bold" fill="#1b231f">A7: 電磁石の吸着面の上に厚紙、その上にセンサー</text><path d="M560 330 H960" stroke="#8a958e" stroke-width="2"/><rect x="660.0" y="210.0" width="150.0" height="120.0" fill="#5b636b" stroke="#4a524d" /><rect x="660.0" y="206.0" width="150.0" height="6.0" fill="#9aa3ab" stroke="#4a524d" /><text x="735.0" y="275.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">電磁石</text><text x="735.0" y="293.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#e8ebe9">吸着面が上</text><rect x="652.0" y="200.0" width="166.0" height="5.0" fill="#e3c99a" stroke="#a88b57" /><rect x="652.0" y="195.0" width="166.0" height="5.0" fill="#e3c99a" stroke="#a88b57" /><rect x="652.0" y="190.0" width="166.0" height="5.0" fill="#e3c99a" stroke="#a88b57" /><rect x="720.0" y="181.0" width="30.0" height="9.0" fill="#262a2d" stroke="#4a524d" /><rect x="712.0" y="177.0" width="46.0" height="4.0" fill="#f2d16b" stroke="#b89a3c" /><path d="M818.0 193.0 L860.0 160.0" stroke="#7a857e" fill="none"/><circle cx="818.0" cy="193.0" r="2.5" fill="#7a857e"/><text x="864.0" y="156.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1b231f">厚紙 2〜3 枚</text><text x="864.0" y="172.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">（合わせて 2〜3mm）</text><path d="M735.0 178.0 L735.0 130.0" stroke="#7a857e" fill="none"/><circle cx="735.0" cy="178.0" r="2.5" fill="#7a857e"/><text x="735.0" y="124.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1b231f">センサー。マーク面を上、吸着面の真ん中</text><path d="M664.0 202.0 L600.0 160.0" stroke="#7a857e" fill="none"/><circle cx="664.0" cy="202.0" r="2.5" fill="#7a857e"/><text x="596.0" y="144.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#c0392b">縁の近くには置かない</text><text x="596.0" y="160.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#c0392b">（縁は逆の極）</text></svg>