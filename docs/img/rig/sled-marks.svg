<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 564" width="900" height="564" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif"><rect width="900" height="564" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f7b74"/></marker><marker id="hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b231f">台車の位置の合わせ方（上から見た図。上が奥、下が手前）</text><text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5a6760">取っ手の切り込みを台の左端の面にそろえると、電磁石がそのマスの真下に来る。図は「中」をそろえたところ</text><rect x="265.0" y="150.0" width="510.0" height="238.0" fill="#e6ebe7" stroke="#8a958e"/><rect x="265.0" y="195.9" width="510.0" height="17.0" fill="#c9d1cb" stroke="#8a958e"/><rect x="265.0" y="325.1" width="510.0" height="17.0" fill="#c9d1cb" stroke="#8a958e"/><rect x="316.0" y="192.5" width="408.0" height="153.0" fill="none" stroke="#5a6760" stroke-dasharray="6 4"/><path d="M350.2 212.4 V325.6" stroke="#5a6760" stroke-dasharray="3 3"/><path d="M463.4 212.4 V325.6" stroke="#5a6760" stroke-dasharray="3 3"/><path d="M576.6 212.4 V325.6" stroke="#5a6760" stroke-dasharray="3 3"/><path d="M689.8 212.4 V325.6" stroke="#5a6760" stroke-dasharray="3 3"/><path d="M350.2 212.4 H689.8 M350.2 325.6 H689.8" stroke="#5a6760" stroke-dasharray="3 3"/><text x="406.8" y="178.9" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1b231f">左のマス</text><text x="520.0" y="178.9" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1b231f">真ん中のマス</text><text x="633.2" y="178.9" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#1b231f">右のマス</text><text x="520.0" y="364.8" font-size="12" text-anchor="middle" font-weight="normal" fill="#5a6760">試作するマス（センサーの真上）</text><rect x="465.6" y="216.3" width="108.8" height="105.4" rx="4" fill="#c08a5e" opacity="0.9"/><circle cx="520.0" cy="269.0" r="42.5" fill="#5b636b"/><text x="520.0" y="274.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">電磁石</text><rect x="44.0" y="255.4" width="421.6" height="27.2" fill="#c08a5e"/><text x="50.0" y="247.4" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">取っ手（手で押し引きする）</text><rect x="376.2" y="252.0" width="4" height="34.0" fill="#1b231f"/><rect x="367.2" y="281.2" width="22" height="21" fill="#ffffff"/><text x="378.2" y="298.2" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b231f">左</text><rect x="263.0" y="252.0" width="4" height="34.0" fill="#1b231f"/><rect x="254.0" y="281.2" width="22" height="21" fill="#ffffff"/><text x="265.0" y="298.2" font-size="16" text-anchor="middle" font-weight="bold" fill="#c0392b">中</text><rect x="149.8" y="252.0" width="4" height="34.0" fill="#1b231f"/><rect x="140.8" y="281.2" width="22" height="21" fill="#ffffff"/><text x="151.8" y="298.2" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b231f">右</text><path d="M265.0 126.2 V425.4" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="5 3"/><text x="265.0" y="119.4" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#c0392b">台の左端の面</text><text x="151.8" y="324.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5a6760">台車に近い方から「左」「中」「右」と書く</text><text x="775.0" y="142.0" font-size="12" text-anchor="end" font-weight="normal" fill="#5a6760">奥（センサーと LED の線が出る側）</text><text x="775.0" y="406.0" font-size="12" text-anchor="end" font-weight="normal" fill="#5a6760">手前</text><text x="44.0" y="458.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">そろえる切り込み</text><text x="194.0" y="458.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">電磁石が真下に来るマス</text><text x="44.0" y="482.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1b231f">左</text><text x="194.0" y="482.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1b231f">左のマス</text><text x="44.0" y="506.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1b231f">中</text><text x="194.0" y="506.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1b231f">真ん中のマス（試作するマス、センサーの真下）</text><text x="44.0" y="530.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1b231f">右</text><text x="194.0" y="530.0" font-size="13" text-anchor="start" font-weight="normal" fill="#1b231f">右のマス</text></svg>