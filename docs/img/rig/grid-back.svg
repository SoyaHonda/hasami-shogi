<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f7b74"/></marker></defs><rect width="1240" height="470" fill="#ffffff"/><text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b231f">格子板の裏（C5 で、裏返してアクリルに重ねたところを上から見た図）</text><text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5a6760">長い辺を軸に裏返すので、左右の端はそのまま、線が出る辺が手前に来る。灰色が窓と溝（板を突き抜けている）</text><rect x="140.0" y="120.0" width="720.0" height="270.0" fill="#f1f4f1" stroke="#8a958e" /><circle cx="170.0" cy="141.0" r="10.8" fill="#cfd6d0" stroke="#8a958e"/><circle cx="170.0" cy="369.0" r="10.8" fill="#cfd6d0" stroke="#8a958e"/><circle cx="830.0" cy="141.0" r="10.8" fill="#cfd6d0" stroke="#8a958e"/><circle cx="830.0" cy="369.0" r="10.8" fill="#cfd6d0" stroke="#8a958e"/><rect x="485.0" y="265.8" width="75.0" height="124.2" fill="#cfd6d0" stroke="none" /><rect x="530.0" y="181.2" width="30.0" height="85.2" fill="#cfd6d0" stroke="none" /><rect x="465.2" y="181.2" width="69.6" height="51.6" fill="#cfd6d0" stroke="none" /><rect x="486.2" y="243.6" width="27.6" height="22.8" fill="#cfd6d0" stroke="none" /><rect x="467.0" y="183.0" width="66.0" height="48.0" fill="#2f6db3" stroke="#1d4f86" /><text x="500.0" y="212.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#ffffff">LED（裏）</text><path d="M527.0 195.0 H537.2 V420.0" stroke="#c0392b" stroke-width="3" fill="none"/><path d="M527.0 204.0 H545.0 V420.0" stroke="#1b231f" stroke-width="3" fill="none"/><path d="M527.0 213.0 H552.8 V420.0" stroke="#27ae60" stroke-width="3" fill="none"/><rect x="488.0" y="245.4" width="24.0" height="19.2" fill="#262a2d" stroke="#4a524d" /><path d="M492.2 264.6 V420.0" stroke="#c0392b" stroke-width="3" fill="none"/><path d="M500.0 264.6 V420.0" stroke="#1b231f" stroke-width="3" fill="none"/><path d="M507.8 264.6 V420.0" stroke="#d4ac0d" stroke-width="3" fill="none"/><rect x="479.0" y="237.0" width="42.0" height="36.0" fill="#f2d16b" stroke="#b89a3c" opacity="0.55"/><rect x="128.0" y="111.0" width="36.0" height="288.0" fill="#f2d16b" stroke="#b89a3c" opacity="0.45"/><rect x="836.0" y="111.0" width="36.0" height="288.0" fill="#f2d16b" stroke="#b89a3c" opacity="0.45"/><text x="500.0" y="110.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b231f">奥</text><text x="500.0" y="440.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b231f">手前（線が出る辺）。表に返したら、この辺を奥に向けて台に載せる</text><text x="130.0" y="260.0" font-size="14" text-anchor="end" font-weight="bold" fill="#1b231f">左</text><text x="870.0" y="260.0" font-size="14" text-anchor="start" font-weight="bold" fill="#1b231f">右</text><path d="M500.0 183.0 L902.0 112.0" stroke="#7a857e" fill="none"/><circle cx="500.0" cy="183.0" r="2.5" fill="#7a857e"/><text x="910.0" y="116.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">LED。光る面を下にして大きい窓に入れる</text><text x="910.0" y="133.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">線は右の溝へ出す</text><path d="M554.0 207.0 L902.0 168.0" stroke="#7a857e" fill="none"/><circle cx="554.0" cy="207.0" r="2.5" fill="#7a857e"/><text x="910.0" y="172.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">LED の線の溝</text><text x="910.0" y="189.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">センサーの窓の右を通り、センサーの線の溝に合流する</text><path d="M521.0 249.0 L902.0 224.0" stroke="#7a857e" fill="none"/><circle cx="521.0" cy="249.0" r="2.5" fill="#7a857e"/><text x="910.0" y="228.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">センサー（OA）。マーク面を下にして窓に入れる</text><text x="910.0" y="245.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">上から当てもの（黄）を載せ、テープで押さえる</text><path d="M557.0 339.0 L902.0 280.0" stroke="#7a857e" fill="none"/><circle cx="557.0" cy="339.0" r="2.5" fill="#7a857e"/><text x="910.0" y="284.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">線の溝（幅 12.5mm、辺まで）</text><text x="910.0" y="301.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">センサーと LED の線を 2〜3 か所テープで留める</text><path d="M848.0 363.0 L902.0 336.0" stroke="#7a857e" fill="none"/><circle cx="848.0" cy="363.0" r="2.5" fill="#7a857e"/><text x="910.0" y="340.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">短い辺に 1 回だけテープを巻く</text><text x="910.0" y="357.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">何重にも巻くと位置決めの型がかぶさらない</text></svg>