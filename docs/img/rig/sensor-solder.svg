<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 738" width="900" height="738" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif"><rect width="900" height="738" fill="#ffffff"/><text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b231f">センサー（DRV5053）に線を付ける</text><text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5a6760">マーク面（文字のある面）を自分に向け、足を下にして持った図。OA と PA で同じ</text><path d="M300 204.0 V142.4 L322.4 120 H389.6 L412.0 142.4 V204.0 Z" fill="#262a2d"/><text x="356.0" y="167.6" font-size="13" text-anchor="middle" font-weight="bold" fill="#e8ebe9">53OA</text><text x="426.0" y="164.8" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5a6760">マーク面（文字のある面）</text><rect x="317.9" y="204.0" width="5" height="201.6" fill="#b7bcc0"/><text x="320.4" y="196.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b231f"></text><rect x="353.5" y="204.0" width="5" height="285.6" fill="#b7bcc0"/><text x="356.0" y="196.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b231f"></text><rect x="389.1" y="204.0" width="5" height="369.6" fill="#b7bcc0"/><text x="391.6" y="196.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b231f"></text><rect x="314.4" y="372.0" width="12" height="266.0" rx="3" fill="#c0392b"/><rect x="312.4" y="346.8" width="16" height="61.6" rx="4" fill="#9aa5ad" opacity="0.75"/><text x="320.4" y="660.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b231f">1</text><rect x="350.0" y="456.0" width="12" height="182.0" rx="3" fill="#1b231f"/><rect x="348.0" y="430.8" width="16" height="61.6" rx="4" fill="#9aa5ad" opacity="0.75"/><text x="356.0" y="660.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b231f">2</text><rect x="385.6" y="540.0" width="12" height="98.0" rx="3" fill="#d4ac0d"/><rect x="383.6" y="514.8" width="16" height="61.6" rx="4" fill="#9aa5ad" opacity="0.75"/><text x="391.6" y="660.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1b231f">3</text><rect x="310.4" y="278.0" width="55.6" height="20" rx="9" fill="#d68910" stroke="#7e5109"/><text x="338.2" y="292.5" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#ffffff">103</text><path d="M230.0 204.0 H306.4" stroke="#c8d0ca" stroke-dasharray="3 3"/><text x="224.0" y="208.0" font-size="12" text-anchor="end" font-weight="normal" fill="#5a6760">0mm</text><path d="M230.0 288.0 H306.4" stroke="#c8d0ca" stroke-dasharray="3 3"/><text x="224.0" y="292.0" font-size="12" text-anchor="end" font-weight="normal" fill="#5a6760">3mm</text><path d="M230.0 372.0 H306.4" stroke="#c8d0ca" stroke-dasharray="3 3"/><text x="224.0" y="376.0" font-size="12" text-anchor="end" font-weight="normal" fill="#5a6760">6mm</text><path d="M230.0 456.0 H306.4" stroke="#c8d0ca" stroke-dasharray="3 3"/><text x="224.0" y="460.0" font-size="12" text-anchor="end" font-weight="normal" fill="#5a6760">9mm</text><path d="M230.0 540.0 H306.4" stroke="#c8d0ca" stroke-dasharray="3 3"/><text x="224.0" y="544.0" font-size="12" text-anchor="end" font-weight="normal" fill="#5a6760">12mm</text><path d="M407.6 288.0 H474.0" stroke="#c8d0ca"/><text x="482.0" y="289.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#1b231f">コンデンサー 0.01µF（103）</text><text x="482.0" y="307.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">1 番と 2 番の足に、本体から約 3mm。なければ付けない</text><path d="M407.6 372.0 H474.0" stroke="#c8d0ca"/><text x="482.0" y="373.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#1b231f">1 番 VCC ← 赤の線（6mm の所）</text><text x="482.0" y="391.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">ブレッドボードの右 22（3.3V の行）へ</text><path d="M407.6 456.0 H474.0" stroke="#c8d0ca"/><text x="482.0" y="457.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#1b231f">2 番 GND ← 黒の線（9mm の所）</text><text x="482.0" y="475.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">GND の電源ラインへ</text><path d="M407.6 540.0 H474.0" stroke="#c8d0ca"/><text x="482.0" y="541.0" font-size="13.5" text-anchor="start" font-weight="bold" fill="#1b231f">3 番 OUT ← 黄の線（12mm の所）</text><text x="482.0" y="559.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">ブレッドボードの右 27 へ</text><text x="24.0" y="698.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1b231f">つなぎ目の高さをずらすと、3 本を並べても幅が狭くなり、格子板の幅 5mm の溝に入る。つなぎ目は 1 つずつ熱収縮チューブかテープ（灰色）で包む。</text><text x="24.0" y="718.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1b231f">足の間隔は 1.27mm しかない。同じ所を 3 秒以上温め続けない。余った足は切る。</text></svg>