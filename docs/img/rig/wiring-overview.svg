<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 676" width="854" height="676" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif"><rect width="854" height="676" fill="#ffffff"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f7b74"/></marker><marker id="hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c0392b"/></marker></defs><text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b231f">配線の全体（12V は TB67H450 の VM にだけ入る）</text><text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5a6760">矢印は信号の向き。ほかの部品は ESP32 の 3.3V と 5V で動く。どの列に挿すかはブレッドボードの図</text><rect x="24" y="80" width="180" height="330" rx="8" fill="none" stroke="#6f7b74" stroke-width="1.3"/><text x="36.0" y="104.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">ESP32-DevKitC-32E</text><text x="36.0" y="124.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">PC の USB で動く</text><text x="36.0" y="140.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">オス-メスの線 7 本で</text><text x="36.0" y="156.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">ブレッドボードへ</text><rect x="320" y="80" width="220" height="76" rx="8" fill="none" stroke="#6f7b74" stroke-width="1.3"/><text x="332.0" y="104.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">DRV5053（OA か PA）</text><text x="332.0" y="124.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">格子板の真ん中の窓</text><text x="332.0" y="140.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">VCC は 3.3V、GND</text><rect x="320" y="200" width="220" height="76" rx="8" fill="none" stroke="#6f7b74" stroke-width="1.3"/><text x="332.0" y="224.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">SN74AHCT125N</text><text x="332.0" y="244.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">3.3V の信号を 5V にする</text><text x="332.0" y="260.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">1A → 1Y の 1 組だけ使う</text><rect x="320" y="320" width="220" height="90" rx="8" fill="none" stroke="#6f7b74" stroke-width="1.3"/><text x="332.0" y="344.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">AE-TB67H450</text><text x="332.0" y="364.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">IN1・IN2 で向きと強さ</text><text x="332.0" y="380.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">VREF は 3.3V、RS は GND</text><text x="332.0" y="396.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">VM に 12V</text><rect x="640" y="200" width="190" height="76" rx="8" fill="none" stroke="#aab3ae" stroke-width="1.3" stroke-dasharray="5 4"/><text x="652.0" y="224.0" font-size="13" text-anchor="start" font-weight="bold" fill="#8a948f">LED</text><text x="652.0" y="244.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">段階1 ではつながない</text><text x="652.0" y="260.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">（本番の LED テープ）</text><rect x="640" y="328" width="190" height="76" rx="8" fill="none" stroke="#6f7b74" stroke-width="1.3"/><text x="652.0" y="352.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">電磁石</text><text x="652.0" y="372.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">ZYE1-P25/20、台車の上</text><text x="652.0" y="388.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">12V 0.33A</text><rect x="640" y="446" width="190" height="76" rx="8" fill="none" stroke="#6f7b74" stroke-width="1.3"/><text x="652.0" y="470.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">AC アダプター</text><text x="652.0" y="490.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">12V 3A</text><text x="652.0" y="506.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">DC ジャックで受ける</text><g fill="none" stroke="#6f7b74" stroke-width="1.4"><path d="M320 118H206" marker-end="url(#ar)"/><path d="M204 238H318" marker-end="url(#ar)"/><path d="M540 238H638" marker-end="url(#ar)" stroke-dasharray="5 4"/><path d="M204 352H318" marker-end="url(#ar)"/><path d="M204 384H318" marker-end="url(#ar)"/><path d="M540 366H638" marker-end="url(#ar)"/><path d="M114 410V556" marker-end="url(#ar)"/><path d="M735 522V556" marker-end="url(#ar)"/></g><path d="M640 484H430V412" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#hot)"/><text x="262.0" y="110.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5a6760">OUT → VP（GPIO36）</text><text x="262.0" y="230.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5a6760">GPIO13 → 1A</text><text x="589.0" y="230.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5a6760">1Y → DI</text><text x="262.0" y="344.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5a6760">GPIO18 → IN1</text><text x="262.0" y="400.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5a6760">GPIO4 → IN2</text><text x="589.0" y="358.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5a6760">OUT1・OUT2</text><text x="535.0" y="476.0" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#c0392b">＋ → VM（12V）</text><text x="124.0" y="490.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">3V3・5V・GND</text><text x="745.0" y="544.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">− → GND</text><rect x="24" y="556" width="806" height="96" rx="8" fill="#f2f5f3" stroke="#6f7b74" stroke-width="1.3"/><text x="36.0" y="580.0" font-size="13" text-anchor="start" font-weight="bold" fill="#1b231f">電源と GND（ブレッドボードの電源ライン 2 本と、3.3V の列）</text><text x="36.0" y="602.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1b231f">3.3V（ESP32 の 3V3）→ センサーの VCC、TB67H450 の VREF</text><text x="36.0" y="622.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1b231f">5V（ESP32 の 5V）→ 74AHCT125 の 14 番（VCC）</text><text x="36.0" y="642.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1b231f">GND → ESP32、センサー、74AHCT125（1 番・7 番と使わないピン）、TB67H450 の GND と RS、DC ジャックの −</text></svg>