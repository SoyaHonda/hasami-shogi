<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 330" width="1010" height="330" font-family="'Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif"><rect width="1010" height="330" fill="#ffffff"/><text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b231f">部品に付ける線の作り方（1 本ずつ、先に 11 本まとめて作る）</text><text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5a6760">オス-メスのジャンパーならメスの端を、オス-オスなら片方のオスの端を切る。残ったオスの端はブレッドボードに挿すのに使う</text><rect x="24.0" y="80.0" width="230.0" height="200.0" rx="8" fill="#f6f7f5" stroke="#d5dad6" /><text x="38.0" y="106.0" font-size="14.5" text-anchor="start" font-weight="bold" fill="#1b231f">① 端を切る</text><rect x="38.0" y="154.0" width="10.0" height="12.0" rx="0" fill="#d4ac0d" stroke="none" /><rect x="48.0" y="153.0" width="20.0" height="14.0" rx="2" fill="#222" stroke="none" /><path d="M68 160 H194" stroke="#c0392b" stroke-width="7"/><rect x="194.0" y="153.0" width="22.0" height="14.0" rx="2" fill="#222" stroke="none" /><path d="M190 142 L190 178" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/><text x="190.0" y="194.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#c0392b">ここで切る</text><text x="205.0" y="146.0" font-size="10.5" text-anchor="middle" font-weight="normal" fill="#5a6760">メス</text><text x="38.0" y="226.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">ニッパーで、端の黒い部分の</text><text x="38.0" y="244.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">すぐ根元を切る</text><rect x="268.0" y="80.0" width="230.0" height="200.0" rx="8" fill="#f6f7f5" stroke="#d5dad6" /><text x="282.0" y="106.0" font-size="14.5" text-anchor="start" font-weight="bold" fill="#1b231f">② 被覆を 5mm むく</text><rect x="282.0" y="154.0" width="10.0" height="12.0" rx="0" fill="#d4ac0d" stroke="none" /><rect x="292.0" y="153.0" width="20.0" height="14.0" rx="2" fill="#222" stroke="none" /><path d="M312 160 H418" stroke="#c0392b" stroke-width="7"/><path d="M418 158 L446 154" stroke="#c98b45" stroke-width="1.2"/><path d="M418 159 L446 157" stroke="#c98b45" stroke-width="1.2"/><path d="M418 160 L446 160" stroke="#c98b45" stroke-width="1.2"/><path d="M418 161 L446 163" stroke="#c98b45" stroke-width="1.2"/><path d="M418 162 L446 166" stroke="#c98b45" stroke-width="1.2"/><text x="432.0" y="190.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5a6760">5mm</text><text x="282.0" y="226.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">ニッパーの刃で軽く挟み、</text><text x="282.0" y="244.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">線を 1 回転させて切れ目を入れ、</text><text x="282.0" y="262.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">線の先へ引き抜く</text><rect x="512.0" y="80.0" width="230.0" height="200.0" rx="8" fill="#f6f7f5" stroke="#d5dad6" /><text x="526.0" y="106.0" font-size="14.5" text-anchor="start" font-weight="bold" fill="#1b231f">③ 芯線をよる</text><rect x="526.0" y="154.0" width="10.0" height="12.0" rx="0" fill="#d4ac0d" stroke="none" /><rect x="536.0" y="153.0" width="20.0" height="14.0" rx="2" fill="#222" stroke="none" /><path d="M556 160 H662" stroke="#c0392b" stroke-width="7"/><path d="M662 160 H690" stroke="#c98b45" stroke-width="4" stroke-dasharray="3 2"/><text x="676.0" y="190.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5a6760">ねじる</text><text x="526.0" y="226.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">細い線がばらけないよう、</text><text x="526.0" y="244.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">指でねじってまとめる</text><rect x="756.0" y="80.0" width="230.0" height="200.0" rx="8" fill="#f6f7f5" stroke="#d5dad6" /><text x="770.0" y="106.0" font-size="14.5" text-anchor="start" font-weight="bold" fill="#1b231f">④ はんだを薄くなじませる</text><rect x="770.0" y="154.0" width="10.0" height="12.0" rx="0" fill="#d4ac0d" stroke="none" /><rect x="780.0" y="153.0" width="20.0" height="14.0" rx="2" fill="#222" stroke="none" /><path d="M800 160 H906" stroke="#c0392b" stroke-width="7"/><path d="M906 160 H934" stroke="#b8bec4" stroke-width="4.5" stroke-linecap="round"/><text x="920.0" y="190.0" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#5a6760">銀色になる</text><text x="770.0" y="226.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">芯線にこてを当て、はんだを</text><text x="770.0" y="244.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">少し溶かして染み込ませる</text><text x="770.0" y="262.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">（予備はんだ）</text><text x="24.0" y="310.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#1b231f">熱収縮チューブを使うときは、④のあと、部品にはんだ付けする前に線に通しておく（あとからは通せない）。</text></svg>