<text x="24.0" y="34.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b231f">DC ジャックの基板にピンヘッダーを付ける（A3-3）</text>
<text x="24.0" y="56.0" font-size="12.5" text-anchor="start" font-weight="normal" fill="#5a6760">上の 4 つは、手前（電源ラインの側）から見た図。ブレッドボードを支えにすると、2 本のピンがまっすぐ、正しい間隔で付く</text>
<rect x="24.0" y="80.0" width="280.0" height="470.0" rx="8" fill="#f6f7f5" stroke="#d5dad6" />
<text x="38.0" y="108.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1b231f">① ジャックを先に付ける</text>
<rect x="317.0" y="80.0" width="280.0" height="470.0" rx="8" fill="#f6f7f5" stroke="#d5dad6" />
<text x="331.0" y="108.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1b231f">② ピンヘッダーを挿す</text>
<rect x="610.0" y="80.0" width="280.0" height="470.0" rx="8" fill="#f6f7f5" stroke="#d5dad6" />
<text x="624.0" y="108.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1b231f">③ 基板をかぶせる</text>
<rect x="903.0" y="80.0" width="280.0" height="470.0" rx="8" fill="#f6f7f5" stroke="#d5dad6" />
<text x="917.0" y="108.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1b231f">④ 上からはんだ付け</text>
