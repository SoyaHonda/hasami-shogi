<text x="939.0" y="283.0" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">先に 1 本</text>
<text x="917.0" y="140.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1b231f">端の 1 本だけ付けて、基板が</text>
<text x="917.0" y="158.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1b231f">傾いていないか見る。よければ</text>
<text x="917.0" y="176.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1b231f">残りの 7 本（奥の列も）を付ける</text>
<text x="917.0" y="466.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">こては基板の外側から当てる。</text>
<text x="917.0" y="484.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">ジャックとブレッドボードの</text>
<text x="917.0" y="502.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5a6760">プラスチックに当てない</text>
<text x="917.0" y="530.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1b231f">終わったら挿したまま残す</text>
<text x="24.0" y="600.0" font-size="15" text-anchor="start" font-weight="bold" fill="#1b231f">横から見た図（30 列の側から見たところ）。2 本のピンヘッダーが溝をまたぐ</text>
